<div x-data>
  <div class="position-fixed bottom-0 end-0 p-3" style="z-index: 1050;">
    <div x-ref="toast" class="toast hide" role="alert" aria-live="assertive" aria-atomic="true" data-bs-autohide="false">
      <div class="toast-header d-flex align-items-center justify-content-between">
        <div class="d-flex align-items-center gap-2">
          <svg viewBox="-12 -12 24 24" width="16" height="16" class="spin-cw" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
            <path d="M -2.5,-8.5 L -2,-10.5 L 2,-10.5 L 2.5,-8.5 L 5,-7.5 L 7,-8.5 L 8.5,-7 L 7.5,-5 L 8.5,-2.5 L 10.5,-2 L 10.5,2 L 8.5,2.5 L 7.5,5 L 8.5,7 L 7,8.5 L 5,7.5 L 2.5,8.5 L 2,10.5 L -2,10.5 L -2.5,8.5 L -5,7.5 L -7,8.5 L -8.5,7 L -7.5,5 L -8.5,2.5 L -10.5,2 L -10.5,-2 L -8.5,-2.5 L -7.5,-5 L -8.5,-7 L -7,-8.5 L -5,-7.5 Z" />
            <circle cx="0" cy="0" r="3" />
          </svg>
          <strong class="me-auto" x-text="$store.toast.title"></strong>
        </div>
        <div class="d-flex align-items-center gap-2">
          <small class="auth-hint">just now</small>
          <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
      </div>
      <div class="toast-body" x-html="$store.toast.html">
      </div>
    </div>
  </div>
</div>

<div x-data>
  <div class="modal fade" x-ref="modal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title font-serif" x-text="$store.modal.title"></h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <p x-html="$store.modal.html"></p>
        </div>
        <div class="modal-footer">
          <button type="button" class="auth-btn-primary px-4" data-bs-dismiss="modal">Got it!</button>
        </div>
      </div>
    </div>
  </div>
</div>
